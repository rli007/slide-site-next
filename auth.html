<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide – Log in / Sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body class="min-h-screen flex flex-col bg-gray-50 font-sans text-gray-800">
    <!-- === NAVBAR === -->
    <header class="bg-white/70 backdrop-blur-md fixed top-0 inset-x-0 z-50 shadow-sm">
      <div class="max-w-3xl mx-auto flex items-center justify-between p-4">
        <a href="index.html" class="text-2xl font-extrabold text-indigo-600">Slide</a>
        <a href="index.html" class="rounded-xl bg-gray-100 px-4 py-1.5 text-sm font-medium hover:bg-gray-200 transition">← Home</a>
      </div>
    </header>
    <div class="h-16"></div>

    <!-- === AUTH CARD === -->
    <main class="flex-1 flex items-center justify-center py-12 px-4">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <h2 id="authTitle" class="text-2xl font-extrabold text-center mb-6">Log in to Slide</h2>
        <form id="authForm" onsubmit="handleAuth(event)">
          <label class="block mb-4">
            <span class="text-sm font-medium">Email</span>
            <input type="email" id="email" required class="mt-1 w-full rounded-lg border-gray-300 focus:ring-indigo-600" />
          </label>
          <label class="block mb-6">
            <span class="text-sm font-medium">Password</span>
            <input type="password" id="password" required class="mt-1 w-full rounded-lg border-gray-300 focus:ring-indigo-600" />
          </label>
          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-semibold rounded-lg py-2 hover:bg-indigo-700 transition">Log&nbsp;in</button>
          <p id="toggleAuth" class="text-xs text-center mt-4 text-indigo-600 cursor-pointer" onclick="toggleMode()">Need an account? Sign up</p>
        </form>
      </div>
    </main>

    <!-- === FOOTER === -->
    <footer class="bg-gray-900 text-gray-400 text-xs py-4 text-center">
      © 2025 Slide Logistics, Inc.
    </footer>

    <!-- === SCRIPTS === -->
    <script>
      feather.replace();

      const LS_KEY = 'slideUser';
      let authMode = 'login';

      function toggleMode() {
        authMode = authMode === 'login' ? 'signup' : 'login';
        document.getElementById('authTitle').textContent = authMode === 'login' ? 'Log in to Slide' : 'Create your Slide account';
        document.getElementById('submitBtn').textContent = authMode === 'login' ? 'Log in' : 'Sign up';
        document.getElementById('toggleAuth').textContent = authMode === 'login' ? 'Need an account? Sign up' : 'Have an account? Log in';
      }

      function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pw = document.getElementById('password').value.trim();
        if (!email || !pw) return;
        let user = JSON.parse(localStorage.getItem(LS_KEY) || null);

        if (authMode === 'signup') {
          if (user) {
            alert('An account already exists. Please log in.');
            return;
          }
          user = { email, role: null, routes: [], packages: [] };
          localStorage.setItem(LS_KEY, JSON.stringify(user));
          window.location.href = 'role-select.html';
        } else {
          if (!user || user.email !== email) {
            alert('No account found. Please sign up.');
            return;
          }
          window.location.href = user.role ? (user.role === 'slider' ? 'slider-dashboard.html' : 'shipper-dashboard.html') : 'role-select.html';
        }
      }

      // Auto-redirect if already logged in
      document.addEventListener('DOMContentLoaded', () => {
        const user = JSON.parse(localStorage.getItem(LS_KEY) || null);
        if (user) {
          window.location.href = user.role ? (user.role === 'slider' ? 'slider-dashboard.html' : 'shipper-dashboard.html') : 'role-select.html';
        }
      });
    </script>
  </body>
</html>
